# Соглашение об участии в турнире по Counter-Strike 2 и об отказе от претензий
**Турнир «Lauzent Team vs Dragon Team»**
Место и форма проведения: [Steam - CYBERSHOKE/FASTCUP]
Дата составления: [дд.мм.2026]
## Преамбула
Настоящее Соглашение заключается между Организатором Турнира и каждым Участником и определяет условия участия в Турнире, правила проведения матчей, порядок выплаты призов, а также взаимные права и обязанности сторон. Подписывая Соглашение или иным способом выражая согласие с ним, Участник подтверждает, что внимательно прочитал все его условия, понял их и принимает полностью и без возражений.
## 1. Термины и определения
1.1. Организатор — Lauzent Team в лице [miN0ne], контактные данные: [Discord, Telegram, e-mail].
1.2. Турнир — соревнование по компьютерной игре Counter-Strike 2 (далее — «Игра») между командами Lauzent Team и Dragon Team, проводимое на условиях настоящего Соглашения.

1.10. Соглашение — настоящий документ со всеми приложениями.
## 2. Предмет Соглашения
2.1. Организатор проводит Турнир, а Участник добровольно принимает в нём участие на условиях Соглашения.

2.4. Участие в Турнире является добровольным. Соглашение не создаёт трудовых, агентских или иных отношений, кроме предусмотренных Соглашением. Участник не является работником Организатора и не получает заработную плату.
2.5. Участие в Турнире бесплатное. [Если предусмотрен вступительный взнос, укажите сумму и порядок возврата.]

4.4. Матчи проводятся на актуальной версии Игры на момент начала Турнира. Если Valve выпускает обновление в ходе Турнира, Организатор вправе принять решение о продолжении, переносе или переигровке матча.
4.5. Опоздание. Если Команда не готова к игре через [10] минут после назначенного времени, Организатор вправе присудить ей техническое поражение.
4.6. Технические паузы. Каждой Команде доступны [3] паузы по [2] минуты на карту. Пауза в связи с отключением игрока разрешается на срок не более [5] минут. Повтор раунда допускается только по решению Судьи при технической неисправности, не зависящей от Участников.
4.7. Если игрок потерял связь и не вернулся в срок, Команда вправе продолжить матч в меньшем составе либо, с согласия Судьи, заменить игрока запасным. Решение по спорным ситуациям принимает Судья.
4.8. Запрещено умышленно использовать ошибки Игры (баги), позиции за пределами игровых зон и иные недоработки, дающие нечестное преимущество. Об обнаруженных ошибках следует сообщать Судье.
4.9. Во время матча запрещено получать подсказки от зрителей и третьих лиц, включая просмотр чужих трансляций (stream sniping). Голосовое общение разрешено только между игроками одной Команды и Судьёй.
4.10. Результаты матча подтверждаются данными сервера, демо-файлами (GOTV) и скриншотами. Участники обязаны сохранять демо-записи и предоставлять их Организатору по запросу в течение [7] дней.
4.11. Организатор вправе изменять Регламент до начала соответствующего матча, письменно уведомив капитанов. Изменения не должны ухудшать положение одной из Команд без уважительных причин.
## 5. Честная игра и санкции
5.1. Участникам запрещено:
- использовать читы, сторонние программы, скрипты, макросы и иные средства, дающие нечестное преимущество;
- играть с чужого аккаунта, передавать свой аккаунт, использовать запасные аккаунты (смурфинг);
- заключать договорные матчи, сговариваться с соперником о результате, умышленно проигрывать;
- делать ставки на результат Турнира, а также передавать организаторам ставок или третьим лицам неопубликованные сведения о матче;
- проводить DDoS-атаки, взламывать аккаунты, нарушать работу серверов и Платформы;
- выдавать себя за другое лицо.
5.2. Организатор вправе в разумных пределах запросить у Участника демо-записи, скриншоты, подтверждение личности, запись экрана или демонстрацию экрана во время матча для проверки на нарушения Регламента. Участник соглашается на такие проверки при условии, что они проводятся только в целях Турнира.
5.3. Если на Участника на момент Турнира или в течение [15] дней после него накладывается блокировка (например, VAC-бан) за нарушения, относящиеся к периоду Турнира, это считается нарушением Регламента.
5.4. За нарушение Регламента Организатор вправе применить одну или несколько мер: предупреждение; потеря раунда или карты; техническое поражение; дисквалификация Участника или всей Команды; лишение приза и требование вернуть уже выплаченное; внесение в список недопущенных к будущим турнирам Организатора; публикация краткой информации о причине дисквалификации без раскрытия персональных данных сверх необходимого.
5.5. Решение о санкциях принимает Организатор с учётом объяснений Участника. Участник вправе подать апелляцию в порядке раздела 16.
## 6. Правила поведения
6.1. Участники обязаны уважительно относиться друг к другу, Судье, зрителям и Организатору.
6.2. Запрещены оскорбления, угрозы, травля, дискриминация по расе, национальности, полу, возрасту, религии, убеждениям, а также разглашение чужих персональных данных (доксинг).
6.3. Во время Трансляции и в чатах Турнира следует избегать грубой и нецензурной лексики. Организатор вправе заглушить Участника, удалить его из голосового канала или чата, если его поведение мешает проведению Турнира.
6.4. Участник самостоятельно отвечает за свои высказывания, публикации и действия во время Турнира и после него в отношении других Участников, Судьи и Организатора. Организатор не отвечает за высказывания Участников и зрителей.
6.5. Запрещено распространять недостоверную информацию о результатах, составе Команд или решениях Судьи.
## 7. Призовой фонд и порядок выплат
7.1. Призовой фонд Турнира составляет [500] рублей и формируется за счёт [средств Организатора / партнёров / иных источников].
7.2. Распределение призового фонда:
- победитель Турнира — [500] рублей;
7.3. Призовая сумма, причитающаяся Команде, делится между её игроками [в пропорции, согласованной Командой]. Распределение внутри Команды осуществляется самими Участниками, а Организатор не отвечает за споры между ними.
7.4. Размер призового фонда не может быть уменьшен после начала Турнира, за исключением случаев дисквалификации, отказа Участника от приза или невозможности выплаты по обстоятельствам, не зависящим от Организатора.
7.5. Выплата производится в течение [7] рабочих дней после окончания Турнира и подтверждения итогов, способом [перевод на карту / СБП / электронный кошелёк]. Реквизиты предоставляет каждый Участник либо капитан Команды. Банковские комиссии несёт [получатель].
7.6. Организатор вправе приостановить выплату на срок до [14] дней, если имеются обоснованные подозрения в нарушении Регламента, до завершения проверки.
7.7. Участник самостоятельно несёт обязанность по уплате налогов с полученных доходов, если закон не возлагает эту обязанность на Организатора. Если по закону Организатор обязан удержать налог как налоговый агент, он вправе удержать его из призовой суммы. Участник обязан предоставить необходимые для этого сведения и документы (ИНН, паспортные данные, подтверждение статуса самозанятого и т. п.).
7.8. Организатор не отвечает за задержку выплаты, вызванную ошибочными реквизитами, действиями банка или платёжной системы, а также непредставлением Участником необходимых документов.
7.9. Приз не является оплатой труда или услуг и не компенсирует расходы Участника на участие в Турнире.
7.10. Если Участник или Команда дисквалифицированы либо отказались от приза, Организатор вправе перераспределить приз между остальными призёрами или оставить его у себя, если иное не определено Регламентом.
## 8. Трансляция, съёмка и использование изображения
8.1. Турнир транслируется и записывается. Участник даёт согласие на:
- запись и трансляцию своего игрового процесса, голоса (в том числе голосового общения команды, если оно попадает в эфир или запись), никнейма, аватара, а при использовании веб-камеры — своего изображения;
- публикацию записей, нарезок и повторов на каналах Организатора, стримера ivanbelka47, партнёров Турнира и в социальных сетях;
- использование результатов, статистики, никнеймов и изображений в анонсах, рекламе и обзорах Турнира.
8.2. Согласие даётся безвозмездно, без ограничения территории и на срок [без ограничения]. Для целей статьи 152.1 Гражданского кодекса РФ Участник подтверждает согласие на использование своего изображения в указанных целях. Организатор не обязан публиковать записи.
8.3. Участник вправе до начала Турнира заявить, что не желает использовать веб-камеру. Это не освобождает его от остальных условий Соглашения.
8.4. Отдельного вознаграждения за использование изображения, голоса, никнейма и игрового процесса Участнику не выплачивается.
8.5. Участник обязан перед началом демонстрации экрана или эфира закрыть личные окна, мессенджеры, уведомления, платёжные данные и иную личную информацию. Ответственность за случайный показ личной информации по небрежности лежит на Участнике. Организатор по обоснованному запросу удалит из записей фрагменты, показавшие такую информацию, но не обязан удалять иные записи Турнира.
8.6. Запрещено использовать в эфире и голосовых каналах музыку и иные материалы, защищённые авторскими правами, без разрешения правообладателя. Ответственность за санкции платформы (удаление записи, блокировка канала) несёт нарушивший это правило.
8.7. Исключительные права на аудиовизуальную запись Трансляции принадлежат [Организатору / стримеру ivanbelka47]. Права на игровой контент и материалы Игры принадлежат Valve Corporation и иным правообладателям.

## 10. Согласие на обработку персональных данных
10.1. Участник в соответствии с Федеральным законом от 27.07.2006 № 152-ФЗ «О персональных данных» даёт согласие Организатору на обработку своих персональных данных: никнейма, фамилии, имени, отчества, даты рождения (для проверки возраста), контактных данных, ссылки на профиль Steam и идентификатора аккаунта, реквизитов для выплаты, ИНН и паспортных данных (при необходимости налогового учёта), изображения и голоса.
10.2. Цели обработки: проведение Турнира, проверка личности, возраста и соблюдения Регламента, связь с Участником, выплата приза, исполнение требований налогового и иного законодательства, организация и популяризация Трансляции, рассмотрение споров.
10.3. Допускаются сбор, запись, систематизация, накопление, хранение, уточнение, использование, передача (Платформе, банку или платёжному сервису, налоговым органам, Судье и партнёрам Турнира в необходимом для целей Турнира объёме), обезличивание, блокирование и удаление данных.
10.4. Согласие действует на время проведения Турнира и [3] года после его завершения, либо дольше, если этого требует закон. Участник вправе отозвать согласие письменным заявлением Организатору. Отзыв согласия до окончания Турнира может сделать участие и получение приза невозможными. Обработка данных, которую Организатор обязан продолжать по закону, после отзыва согласия не прекращается.
10.5. Организатор принимает разумные меры для защиты данных и не передаёт их третьим лицам, кроме случаев, указанных в Соглашении или предусмотренных законом.
10.6. Никнейм, результаты матчей и игровая статистика Участника считаются общедоступной информацией в рамках Турнира.
10.7. Если Участник передаёт Организатору данные другого лица (например, законного представителя или члена Команды), он подтверждает, что получил согласие этого лица.
## 11. Осознание рисков и принятие риска
11.1. Участник понимает и принимает, что участие в Турнире связано со следующими рисками:
- технические: сбои интернета и электропитания, неисправность оборудования Участника, лаги, потеря пакетов, вылеты Игры, ошибки и обновления Игры, сбои Steam, Платформы и Discord, DDoS-атаки и иные кибератаки на Участников, серверы и каналы связи;
- организационные: ошибки и задержки судейства, перенос или отмена матчей, изменение расписания и Регламента, возможные неточности правил;
- физические и психоэмоциональные: усталость, напряжение глаз, головные боли, боли в спине и запястьях, нарушение сна, стресс, эмоциональное напряжение при игре и проигрыше. При фоточувствительной эпилепсии и иных заболеваниях участие может ухудшить состояние;
- репутационные: публичность, критика зрителей, комментарии, мемы, нарезки с участием Участника, троллинг и нежелательное внимание;
- информационные: утечка личной информации, которую Участник сам раскрыл в эфире или голосовом канале, мошенничество (фишинг, фальшивые приглашения, поддельные «организаторы»);
- финансовые: возможное отсутствие призового результата, изменение призов в случаях, предусмотренных Соглашением, налоговые последствия получения приза;
- аккаунт и имущество: блокировка или бан аккаунта, потеря внутриигровых предметов и данных.
11.2. Участник подтверждает, что состояние его здоровья позволяет участвовать в Турнире, что при наличии противопоказаний он проконсультировался с врачом, и что обязуется делать перерывы во время длительной игры.
11.3. Если Турнир проводится очно, Участник дополнительно принимает риски поездки, пребывания на площадке, травм, утраты и повреждения имущества. Проезд, проживание, питание и страхование Участник организует самостоятельно, если иное не указано в [Приложении 2].
11.4. Участник осознанно принимает перечисленные риски и участвует в Турнире добровольно, на свой риск.
## 12. Отказ от претензий и освобождение от ответственности
12.1. В максимально допустимой применимым законодательством степени Участник, действуя добровольно и осознанно, освобождает Организатора, стримера, Судью, модераторов, спонсоров и партнёров Турнира, а также их представителей от любых требований, претензий, исков, убытков, расходов и иных обязательств, прямо или косвенно связанных с подготовкой, проведением и итогами Турнира, включая, в частности:
- технические сбои, потерю соединения, вылеты, лаги, ошибки и обновления Игры, Steam, Платформы, Discord и серверов;
- решения Судьи и Организатора по спорным и неурегулированным Регламентом ситуациям, применение санкций и дисквалификацию;
- перенос, изменение, сокращение, досрочное прекращение или отмену Турнира и отдельных матчей, изменение Регламента и турнирной сетки;
- ошибки в подсчёте результатов, составлении сетки и расписания, а также неточности в информации о Турнире;
- блокировку или бан аккаунтов (включая VAC-бан и игровые ограничения), утрату внутриигровых предметов, данных, аккаунтов и оборудования;
- действия других Участников, зрителей и третьих лиц: оскорбления, угрозы, травлю, доксинг, DDoS-атаки, мошенничество, нарушение приватности;
- высказывания и комментарии в Трансляции, чатах и каналах Турнира;
- ухудшение самочувствия, усталость, стресс и иные последствия длительной игры за компьютером;
- упущенную выгоду, моральный вред и репутационные потери.
12.2. Участник обязуется не предъявлять претензий, исков и жалоб (в том числе в суды, надзорные органы, на платформы и в СМИ) по основаниям, перечисленным в пункте 12.1, и не требовать компенсации убытков, морального вреда и упущенной выгоды.
12.3. Отказ от претензий распространяется как на известные, так и на неизвестные Участнику на дату подписания требования, возникшие из обстоятельств, указанных в пункте 12.1, и сохраняет силу после окончания Турнира.
12.4. Положения разделов 12 и 13 не применяются и права Участника не ограничиваются в той части, в которой законодательство не допускает освобождения от ответственности или её ограничения. В частности, настоящий отказ от претензий не распространяется на:
- умышленное нарушение обязательств или умышленное причинение вреда Организатором;
- вред жизни и здоровью, причинённый по вине Организатора;
- права Участника как потребителя, если законодательство о защите прав потребителей применимо к отношениям сторон;
- обязанность Организатора выплатить призовой фонд победителям и призёрам Турнира в соответствии с разделом 7 при отсутствии оснований для отказа в выплате.

6.2. Участник понимает, что Трансляция публична и доступна зрителям из разных стран.
## 7. Изображение несовершеннолетних
7.1. Если Участнику нет 18 лет, использование его изображения (лицо, фото, видео с веб-камеры) допускается только при наличии письменного согласия законного представителя по форме Приложения 4 к Соглашению об участии.
7.2. Организатор не публикует фамилию, имя, отчество, дату рождения, адрес, телефон, сведения об учёбе и иные персональные данные несовершеннолетних Участников.
7.3. Законный представитель вправе в любой момент отозвать согласие в порядке пункта 4.2.
## 8. Сайт и подтверждение согласия
8.1. Участник выражает согласие нажатием кнопки «Принять участие» после каждого из двух документов. В конце сайт показывает код подтверждения (например, LZ-1A2B3C4D).
8.2. Чтобы участие было засчитано, Участник отправляет Организатору сообщение с подтверждением (кнопка «Скопировать подтверждение») в канале [Lauzent Team Turnir] в Discord либо иным способом по пункту 2.3 Соглашения об участии.
8.3. Сайт не сохраняет введённые данные на сервере: ввод ника и проверка выполняются в браузере. [Если сайт начнёт собирать данные, этот пункт нужно изменить.]
8.4. Код подтверждения нужен, чтобы находить сообщение Участника. Он не является электронной подписью.
## 9. Персональные данные
9.1. Персональные данные Участников обрабатываются в порядке раздела 10 Соглашения об участии и Федерального закона от 27.07.2006 № 152-ФЗ «О персональных данных».
## 10. Ответственность и споры
10.1. Права Участника, которые нельзя ограничить по закону, сохраняются, в том числе право на защиту изображения (статья 152.1 Гражданского кодекса РФ).
10.2. Споры решаются путём переговоров, а затем в порядке раздела 20 Соглашения об участии. Применяется законодательство Российской Федерации.
## 11. Заключительные положения
11.1. Соглашение действует с момента нажатия кнопки «Принять участие» после этого документа и до исполнения обязательств по Турниру. Разделы 4, 7 и 10 сохраняют силу после окончания Турнира.
11.2. Изменения вносятся письменно с согласия сторон, в том числе сообщениями в Discord. Номер версии указывается в начале документа.
11.3. Если какое-либо положение окажется недействительным, остальные положения сохраняют силу.

<script>
(function(){

/* --- разбор текста документа --- */
function parse(txt){const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'),b=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
 let h='',ul=false;txt.replace(/\r/g,'').split('\n').forEach(l=>{l=l.trim();if(!l)return;const li=l.startsWith('- ');if(ul&&!li){h+='</ul>';ul=false}
  if(l.startsWith('## '))h+='<h4>'+b(esc(l.slice(3)))+'</h4>';else if(l.startsWith('# '))h+='<h3>'+b(esc(l.slice(2)))+'</h3>';
  else if(li){if(!ul){h+='<ul>';ul=true}h+='<li>'+b(esc(l.slice(2)))+'</li>'}
  else h+='<p>'+b(esc(l)).replace(/^(\d+(?:\.\d+)+\.?)\s/,'<span class="n">$1</span> ')+'</p>'});
 return h+(ul?'</ul>':'')}

  if(failAt===i){li.innerHTML='<span class="ic no">✕</span><span></span>';li.lastChild.textContent=steps[i];await wait(500);return false}

 await wait(350);return true}
/* --- документ --- */
function showDoc(n){return new Promise(async resolve=>{const d=$('doc');bar(n);$('dt').textContent=n===1?'Соглашение об участии':'Лицензионное соглашение';$('dn').textContent='Документ '+n+' из 2';
 d.innerHTML=parse($('doc'+n).textContent);d.scrollTop=0;$('rdb').style.width='0';const btn=$('acc');await show('s-doc');d.scrollTop=0;$('rdb').style.width='0';
 const unlock=()=>{btn.disabled=false;btn.classList.add('hot');$('dhint').innerHTML='<b>Можно принимать участие</b>'};
 const lock=()=>{btn.disabled=true;btn.classList.remove('hot')};
 if(S.requireScroll){lock();$('dhint').textContent='Прокрутите документ до конца, чтобы продолжить'}else unlock();
 const upd=()=>{const m=d.scrollHeight-d.clientHeight,p=m>8?d.scrollTop/m:1;$('rdb').style.width=Math.round(p*100)+'%';if(S.requireScroll&&p>=.97&&btn.disabled)unlock()};
 d.onscroll=upd;setTimeout(upd,60);d.focus({preventScroll:true});
 btn.onclick=()=>{if(btn.disabled)return;btn.onclick=null;d.onscroll=null;resolve()}})}
/* --- итог --- */
function hash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(16).toUpperCase().padStart(8,'0')}
function confetti(){if(RM)return;const r=$('win').querySelector('.tick').getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,cols=['#ff8a1f','#ffb45a','#fff3e6','#2fd39a','#ffd23f','#ff5a00'];
 for(let i=0;i<80;i++){const e=document.createElement('i');e.className='cf';e.style.cssText='left:'+cx+'px;top:'+cy+'px;background:'+cols[i%6];document.body.appendChild(e);
  const a=Math.random()*6.283,d=120+Math.random()*260;e.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:'translate('+Math.cos(a)*d+'px,'+(Math.sin(a)*d+160)+'px) rotate('+(Math.random()*720-360)+'deg)',opacity:0}],{duration:1500+Math.random()*1000,easing:'cubic-bezier(.15,.7,.3,1)'}).onfinish=()=>e.remove()}}
function finish(){bar(4);when=new Date();code='LZ-'+hash([nick,when.toISOString(),S.version1,S.version2].join('|'));
 $('dsub').textContent='Ник: '+nick+'. Осталось отправить подтверждение организатору.';
 $('pn').textContent=nick;$('pt').textContent=who?(who.team+(who.role?' · '+who.role:'')):'Участник';$('pc').textContent=code;$('pd').textContent=when.toLocaleDateString('ru-RU');
 const cd=$('cdw'),T=S.matchDate?new Date(S.matchDate):null;
 if(T&&!isNaN(T)){const p=x=>String(x).padStart(2,'0'),tk=()=>{const ms=T-new Date();if(ms<=0){cd.innerHTML='<div class="nodate">🔴 Матч начался</div>';return false}cd.innerHTML=[[Math.floor(ms/864e5),'дн'],[p(Math.floor(ms/36e5)%24),'ч'],[p(Math.floor(ms/6e4)%60),'мин'],[p(Math.floor(ms/1e3)%60),'сек']].map(a=>'<div><b>'+a[0]+'</b><span>'+a[1]+'</span></div>').join('');return true};if(tk()){const t=setInterval(()=>{if(!tk())clearInterval(t)},1000)}}
 else cd.innerHTML='<div class="nodate">Дата матча будет объявлена в Discord</div>';
 if(S.minorNote){$('note').textContent=S.minorNote;$('note').hidden=false}
 show('s-done').then(()=>setTimeout(confetti,350))}
function confirmText(){const o=-when.getTimezoneOffset(),z='UTC'+(o>=0?'+':'-')+Math.abs(o/60);
 return ['Подтверждаю участие в турнире «'+S.title+'».','Ник: '+nick,'Команда: '+(who?who.team+(who.role?' ('+who.role+')':''):'не указана'),'Принято: Соглашение об участии (v'+S.version1+') и Лицензионное соглашение (v'+S.version2+')','Время: '+when.toLocaleString('ru-RU')+' ('+z+')','Код: '+code].join('\n')}
$('copy').onclick=async()=>{const t=confirmText(),b=$('copy');let ok=false;try{await navigator.clipboard.writeText(t);ok=true}catch(e){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.appendChild(a);a.select();try{ok=document.execCommand('copy')}catch(_){}a.remove()}
 b.textContent=ok?'Скопировано ✓ Отправьте организатору':'Не вышло. Выделите и скопируйте вручную';if(!ok)prompt('Скопируйте подтверждение:',t);setTimeout(()=>{b.textContent='Скопировать подтверждение'},3500)};
/* --- главный сценарий --- */
async function start(){const raw=$('nick').value.trim(),m=$('nmsg'),f=$('nfl');m.textContent='';
 if(raw.length<2){m.textContent='Введите игровой ник (минимум 2 символа).';f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');return}
 nick=raw;who=S.players.find(p=>key(p.nick)===key(raw))||null;const bt=$('check');bt.disabled=true;bar(0);
 const ok=await scan('Проверяем ник',['Проверяем ник «'+raw+'»…','Ищем вас в списке участников…','Проверяем допуск к турниру…'],(!who&&!S.allowAnyNick)?1:-1);
 if(!ok){await show('s-nick');bt.disabled=false;m.innerHTML='Ник не найден в списке участников. Проверьте написание или напишите организатору в <a href="'+S.discord+'" target="_blank" rel="noopener">Discord</a>.';f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');$('nick').focus();return}
 if(who)nick=who.nick;
 await showDoc(1);bar(1);await scan('Фиксируем согласие',['Фиксируем согласие №1…','Готовим лицензионное соглашение…']);
 await showDoc(2);bar(2);await scan('Оформляем участие',['Фиксируем согласие №2…','Оформляем пропуск участника…','Готово!']);
 finish()}
$('check').onclick=start;$('nick').addEventListener('keydown',e=>{if(e.key==='Enter')start()});
setTimeout(()=>$('nick').focus({preventScroll:true}),500);bar(0);
})();
</script>
